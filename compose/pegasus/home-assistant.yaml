services:
  homeassistant:
    image: "ghcr.io/home-assistant/home-assistant:stable"
    container_name: homeassistant
    volumes:
      - $DOCKERDIR/configdata/home-assistant:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
      - /dev:/dev
        #ports:
        #  - "8123:8123"
    restart: unless-stopped
    privileged: true
    network_mode: host
    environment:
      TZ: America/Toronto
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M
    oom_score_adj: -500  # Protect but not as critical as Caddy/Tailscale
