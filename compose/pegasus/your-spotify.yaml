services:
  your_spotify_server:
    container_name: your_spotify_server
    image: yooooomi/your_spotify_server
    restart: always
    ports:
      - "8088:8080"
    links:
      - mongo
    depends_on:
      - mongo
    environment:
      API_ENDPOINT: $API_ENDPOINT
      CLIENT_ENDPOINT: $CLIENT_ENDPOINT
      SPOTIFY_PUBLIC: $SPOTIFY_PUBLIC
      SPOTIFY_SECRET: $SPOTIFY_SECRET
      CORS: i-want-a-security-vulnerability-and-want-to-allow-all-origins
    networks:
      - caddy_proxy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

  your_spotify_web:
    container_name: your_spotify_client
    image: yooooomi/your_spotify_client
    restart: always
    ports:
      - "3001:3000"
    environment:
      API_ENDPOINT: $API_ENDPOINT
    networks:
      - caddy_proxy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

  mongo:
    container_name: your_spotify_mongo
    image: mongo:6
    volumes:
      - $DOCKERDIR/configdata/your-spotify/db:/data/db
    restart: unless-stopped
    networks:
      - caddy_proxy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
