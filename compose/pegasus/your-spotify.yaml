services:
  server:
    container_name: your_spotify_server
    image: yooooomi/your_spotify_server
    restart: always
    ports:
      - "8088:8080"
    links:
      - mongo
    depends_on:
      - mongo
    environment:
      API_ENDPOINT: $API_ENDPOINT
      CLIENT_ENDPOINT: $CLIENT_ENDPOINT
      SPOTIFY_PUBLIC: $SPOTIFY_PUBLIC
      SPOTIFY_SECRET: $SPOTIFY_SECRET
      CORS: i-want-a-security-vulnerability-and-want-to-allow-all-origins
    networks:
      - traefik_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.your-spotify-server-rtr.entrypoints=websecure"
      - "traefik.http.routers.your-spotify-server-rtr.rule=Host(`spotify-server.$DOMAINNAME_1`)"
      - "traefik.http.routers.your-spotify-server-rtr.service=your-spotify-server-svc"
      - "traefik.http.services.your-spotify-server-svc.loadbalancer.server.port=8080"
      - "traefik.http.routers.your-spotify-server-rtr.middlewares=chain-no-auth@file"

  web:
    container_name: your_spotify_client
    image: yooooomi/your_spotify_client
    restart: always
    ports:
      - "3001:3000"
    environment:
      API_ENDPOINT: $API_ENDPOINT
    networks:
      - traefik_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.your-spotify-client-rtr.entrypoints=websecure"
      - "traefik.http.routers.your-spotify-client-rtr.rule=Host(`spotify.$DOMAINNAME_1`)"
      - "traefik.http.routers.your-spotify-client-rtr.service=your-spotify-client-svc"
      - "traefik.http.services.your-spotify-client-svc.loadbalancer.server.port=3000"
      - "traefik.http.routers.your-spotify-client-rtr.middlewares=chain-no-auth@file"

  mongo:
    container_name: mongo
    image: mongo:6
    volumes:
      - $DOCKERDIR/configdata/your-spotify/db:/data/db
    networks:
      - traefik_proxy
