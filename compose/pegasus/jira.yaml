name: jira
services:
  jira:
    image: openproject/openproject:14
    container_name: jira
    ports:
      - 8898:80
    environment:
      - OPENPROJECT_HOST__NAME=jira.ashpanraskar.com
      - OPENPROJECT_SECRET_KEY_BASE=$OPENPROJECT_SECRET_KEY_BASE
    volumes:
      - $DOCKERDIR/configdata/jira/pgdata:/var/openproject/pgdata
      - $DOCKERDIR/configdata/jira/assets:/var/openproject/assets
    restart: unless-stopped
    networks:
      - caddy_proxy

networks:
  caddy_proxy:
    external: true
