services:
  stirling-pdf:
    image: frooodle/s-pdf:latest
    container_name: stirling-pdf
    ports:
      - 8083:8080
    volumes:
      - $DOCKERDIR/configdata/pdf/trainingData:/usr/share/tessdata # Required for extra OCR languages
      - $DOCKERDIR/configdata/pdf/extraConfigs:/configs
    #      - ./customFiles:/customFiles/
    #      - ./logs:/logs/
    environment:
      - DOCKER_ENABLE_SECURITY=false
      - INSTALL_BOOK_AND_ADVANCED_HTML_OPS=false
      - LANGS=en_GB
    restart: unless-stopped
    networks:
      - caddy_proxy
