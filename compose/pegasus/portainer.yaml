name: portainer
services:
  portainer-ce:
    ports:
      - 9008:9000
      - 9443:9443
    container_name: portainer
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - $DOCKERDIR/configdata/portainer:/data
    image: portainer/portainer-ce:lts
    networks:
      - caddy_proxy
      - socket_proxy

volumes:
  portainer_data:
    name: portainer_data

networks:
  caddy_proxy:
    external: true
