name: motioneye
services:
  wyze-bridge:
    container_name: wyze-bridge
    restart: unless-stopped
    image: mrlt8/wyze-bridge:latest
    networks:
      - wyze-bridge-network
    ports:
      - 1935:1935 # RTMP
      - 8554:8554 # RTSP
      - 8888:8888 # HLS
      - 8889:8889 #WebRTC
      - 8189:8189/udp # WebRTC/ICE
      - 5009:5000 # WEB-UI
    environment:
      # [OPTIONAL] Credentials can be set in the WebUI
      # API Key and ID can be obtained from the wyze dev portal:
      # https://developer-api-console.wyze.com/#/apikey/view
      - WYZE_EMAIL=$WYZE_EMAIL
      - WYZE_PASSWORD=$WYZE_PASSWORD
      - API_ID=$WYZE_API_ID
      - API_KEY=$WYZE_API_KEY
      # [OPTIONAL] IP Address of the host to enable WebRTC e.g.,:
      # - WB_IP=192.168.1.122
      # WebUI and Stream authentication:
      - WB_AUTH=false # Set to false to disable web and stream auth.
      # WB_USERNAME=
      # WB_PASSWORD=
  motioneye:
    image: ccrisan/motioneye:master-amd64
    container_name: motioneye
    restart: always
    ports:
      - 8765:8765
    hostname: motioneye
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/motioneye:/etc/motioneye
      - /var/lib/motioneye:/var/lib/motioneye
    networks:
      - caddy_proxy
      - wyze-bridge-network

networks:
  caddy_proxy:
    external: true
  wyze-bridge-network:
    driver: bridge

