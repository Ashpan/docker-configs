services:
  adguard:
    container_name: adguard
    image: adguard/adguardhome
    restart: unless-stopped
    ports:
      - 53:53/tcp # plain dns over tcp
      - 53:53/udp # plain dns over udp
      - 3006:80/tcp # http web interface
      - 3005:3000/tcp # initial setup web interface
    volumes:
      - $DOCKERDIR/configdata/adguard/work:/opt/adguardhome/work
      - $DOCKERDIR/configdata/adguard/conf:/opt/adguardhome/conf
    # Maybe I shouldn't expose this ... hmmm
    networks:
      - traefik_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.adguard-rtr.entrypoints=websecure"
      - "traefik.http.routers.adguard-rtr.rule=Host(`adguard.$DOMAINNAME_1`)"
      - "traefik.http.routers.adguard-rtr.service=adguard-svc"
      - "traefik.http.services.adguard-svc.loadbalancer.server.port=80"
      - "traefik.http.routers.adguard-rtr.middlewares=chain-no-auth@file"
