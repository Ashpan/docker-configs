services:
  adguard:
    container_name: adguard
    image: adguard/adguardhome
    restart: unless-stopped
    ports:
      - 53:53/tcp # plain dns over tcp
      - 53:53/udp # plain dns over udp
      - 3006:80/tcp # http web interface
      - 3005:3000/tcp # initial setup web interface
    volumes:
      - $DOCKERDIR/configdata/adguard/work:/opt/adguardhome/work
      - $DOCKERDIR/configdata/adguard/conf:/opt/adguardhome/conf
    # Maybe I shouldn't expose this ... hmmm
    networks:
      - caddy_proxy
