name: file-server
services:
  static-file-server:
    container_name: file-server
    volumes:
      - $DOCKERDIR/appdata/file-server/data:/web
    ports:
      - 8099:8080
    image: halverneus/static-file-server:latest
    restart: unless-stopped
    networks:
      - caddy_proxy

networks:
  caddy_proxy:
    external: true
