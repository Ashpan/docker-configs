services:

  ########################################################################
  # # Jellyfin to host the media content
  # ######################################################################
  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin
    #    user: 1000:1000    # disabled to use intro skip plugin
    networks:
      - caddy_proxy
    volumes:
      - $DOCKERDIR/configdata/jellyfin/config:/config
      - $DOCKERDIR/configdata/jellyfin/cache:/cache
      - $DATADIR/jellyfin/trickplay:/config/data/trickplay
      - type: bind
        source: /mnt/pegasus
        target: /nas
    restart: "unless-stopped"
    ports:
      - "8096:8096"
    runtime: nvidia
    devices:
      - /dev/nvidia0:/dev/nvidia0
      - /dev/nvidiactl:/dev/nvidiactl
      - /dev/nvidia-modeset:/dev/nvidia-modeset
      - /dev/nvidia-uvm:/dev/nvidia-uvm
      - /dev/nvidia-uvm-tools:/dev/nvidia-uvm-tools
    deploy:
      resources:
        limits:
          cpus: '4.0'        # Can use up to 4 cores
          memory: 4G         # Max 4GB RAM
        reservations:
          cpus: '1.0'        # Guaranteed 1 core
          memory: 2G         # Guaranteed 2GB
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # Optional - alternative address used for autodiscovery
    environment:
      - JELLYFIN_PublishedServerUrl=https://jellyfin.ashpanraskar.com
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,video,utility
    labels:
      - "autoheal=true"
    # Optional - may be necessary for docker healthcheck to pass if running in host network mode
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8096/health && nvidia-smi > /dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ######################################################################
  # # Bittorrent Client connected via VPN
  # ######################################################################
  qbittorrent:
    container_name: qbittorrent
    image: ghcr.io/hotio/qbittorrent:release-v5.1.4
    ports:
      - "8180:8080"
    restart: unless-stopped
    environment:
      - PUID=$PUID
      - PGID=$PGID
      - UMASK=002
      - TZ=$TZ
      - WEBUI_PORTS=8080/tcp,8080/udp
      - VPN_ENABLED=true
      - VPN_CONF=wg-airvpn
      - VPN_PROVIDER=generic
      - VPN_LAN_NETWORK=10.0.0.0/16,100.64.0.0/10
      - VPN_LAN_LEAK_ENABLED=false
      - VPN_AUTO_PORT_FORWARD=false
      - VPN_AUTO_PORT_FORWARD_TO_PORTS=
      - VPN_PORT_REDIRECTS=23508@23508/tcp,23508@23508/udp
      - VPN_KEEP_LOCAL_DNS=false
      - VPN_FIREWALL_TYPE=auto
      - VPN_HEALTHCHECK_ENABLED=true
      - PRIVOXY_ENABLED=false
      - UNBOUND_ENABLED=false
      - VPN_EXPOSE_PORTS_ON_LAN=23508/tcp,23508/udp
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv6.conf.all.disable_ipv6=1
    volumes:
      - $DOCKERDIR/configdata/qbittorrent:/config
      - $DATADIR/Downloads:/downloads
      - /home/ashpan/hdd:/hdd
    networks:
      - caddy_proxy
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 512M

  # ######################################################################
  # # Flaresolverr to pass cloudflare ddos protection
  # ######################################################################
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_HTML=${LOG_HTML:-false}
      - CAPTCHA_SOLVER=${CAPTCHA_SOLVER:-none}
      - TZ=$TZ
    ports:
      - "8191:8191"
    restart: unless-stopped
    networks:
      - caddy_proxy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  ######################################################################
  # Prowlarr to manage indexers between the *arrs
  ######################################################################
  prowlarr:
    container_name: prowlarr
    image: ghcr.io/hotio/prowlarr
    ports:
      - "9696:9696"
    environment:
      - PUID=$PUID
      - PGID=$PGID
      - UMASK=002
      - TZ=$TZ
    volumes:
      - $DOCKERDIR/configdata/prowlarr:/config
    networks:
      - caddy_proxy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

  # ######################################################################
  # # Radarr to manage downloading movies
  # ######################################################################
  radarr:
    container_name: radarr
    image: ghcr.io/hotio/radarr
    privileged: true
    ports:
      - "7878:7878"
    environment:
      - PUID=$PUID
      - PGID=$PGID
      - UMASK=002
      - TZ=$TZ
    volumes:
      - $DOCKERDIR/configdata/radarr:/config
      - $DATADIR:/nas
    networks:
      - caddy_proxy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  # ######################################################################
  # # Sonarr to manage downloading tv shows
  # ######################################################################
  sonarr_tv:
    container_name: sonarr_tv
    image: ghcr.io/hotio/sonarr
    privileged: true
    ports:
      - "8989:8989"
    environment:
      - PUID=$PUID
      - PGID=$PGID
      - UMASK=002
      - TZ=$TZ
    volumes:
      - $DOCKERDIR/configdata/sonarr_tv:/config
      - $DATADIR:/nas
    restart: unless-stopped
    networks:
      - caddy_proxy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  # ######################################################################
  # # Seerr (formerly Jellyseerr) to manage requesting media
  # # Runs as the image's `node` user (UID 1000); config dir must be owned by 1000:1000
  # ######################################################################
  seerr:
    container_name: seerr
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    ports:
      - "5055:5055"
    environment:
      - TZ=$TZ
      - PORT=5055
    volumes:
      - $DOCKERDIR/configdata/jellyseerr:/app/config
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    restart: unless-stopped
    networks:
      - caddy_proxy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

  # ######################################################################
  # # Bazarr to manage downloading subtitles
  # ######################################################################
  bazarr:
    container_name: bazarr
    image: ghcr.io/hotio/bazarr
    ports:
      - "6767:6767"
    environment:
      - PUID=$PUID
      - PGID=$PGID
      - UMASK=002
      - TZ=$TZ
      - WEBUI_PORTS=6767/tcp,6767/udp
    volumes:
      - $DOCKERDIR/configdata/bazarr:/config
      - $DATADIR:/nas
    restart: unless-stopped
    networks:
      - caddy_proxy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

  # ######################################################################
  # # Profilarr to manage quality profiles and custom formats for *arrs
  # ######################################################################
  profilarr:
    container_name: profilarr
    image: ghcr.io/dictionarry-hub/profilarr:latest
    ports:
      - "6868:6868"
    volumes:
      - $DOCKERDIR/configdata/profilarr:/config
    environment:
      - TZ=$TZ
      - AUTH=off
      - ORIGIN=https://profilarr.ashpanraskar.com
    restart: unless-stopped
    networks:
      - caddy_proxy

  # ######################################################################
  # # Recyclarr to sync quality profiles between the *arrs
  # ######################################################################
  recyclarr:
    image: ghcr.io/recyclarr/recyclarr
    container_name: recyclarr
    user: $PUID:$PGID
    networks:
      - caddy_proxy
    volumes:
      - $DOCKERDIR/appdata/recyclarr:/config
    restart: unless-stopped
    environment:
      - TZ=$TZ

  # ######################################################################
  # # Organizr to manage media server services
  # ######################################################################
  organizr:
    container_name: organizr
    image: organizr/organizr
    ports:
      - "8280:80"
    environment:
      - PUID=$PUID
      - PGID=$PGID
    volumes:
      - $DOCKERDIR/configdata/organizr:/config
    restart: unless-stopped
    networks:
      - caddy_proxy

  # ######################################################################
  # # Readarr to manage e/audio book downloads
  # ######################################################################
  readarr:
    container_name: readarr 
    image: ghcr.io/hotio/readarr 
    ports:
      - "8787:8787"
    environment:
      - PUID=$PUID
      - PGID=$PGID
    volumes:
      - $DOCKERDIR/configdata/readarr:/config
      - $DATADIR:/nas
    restart: unless-stopped
    networks:
      - caddy_proxy

  ########################################################################
  # # Streamyfin Optimized Download Server
  # ######################################################################
  # optimized_version_server:
  #   container_name: optimized_version_server_streamyfin
  #   image: fredrikburmester/streamyfin-optimized-versions-server:master
  #   restart: always
  #   ports:
  #     - 3008:3000
  #   environment:
  #     - JELLYFIN_URL=http://jellyfin:8096
  #     - MAX_CONCURRENT_JOBS=3
  #   networks:
  #     - caddy_proxy


  # #####################################################################
  # # Jellyfin-auto-collections to create collections from IMDB lists
  # #####################################################################
  jellyfin-auto-collections:
    image: ghcr.io/ghomashudson/jellyfin-auto-collections:latest
    container_name: jellyfin-auto-collections
    environment:
      - CRONTAB=0 0 * * *
      - TZ=$TZ
      - JELLYFIN_SERVER_URL=${JELLYFIN_SERVER_URL}
      - JELLYFIN_API_KEY=${JELLYFIN_API_KEY}
      - JELLYFIN_USER_ID=${JELLYFIN_USER_ID}
    volumes:
      - $DOCKERDIR/configdata/auto-collections:/app/config
    restart: unless-stopped
    networks:
      - caddy_proxy

  jfa-go:
    container_name: jfa-go
    image: hrfee/jfa-go
    ports:
      - "8056:8056"
    volumes:
      - $DOCKERDIR/configdata/jfa-go/.config/jfa-go:/data  # Path to store config file and other data
      - $DOCKERDIR/configdata/jellyfin/config:/jf          # Only needed for password resets through Jellyfin
      - /etc/localtime:/etc/localtime:ro  # Ensures correct time
    restart: unless-stopped  # Optional: automatically restart container
    networks:
      - caddy_proxy

  audiobookshelf:
    container_name: audiobookshelf
    image: ghcr.io/advplyr/audiobookshelf:latest
    ports:
      - 13378:80
    volumes:
      - type: bind
        source: /mnt/pegasus/Media/Books
        target: /audiobooks
      - $DOCKERDIR/configdata/audiobookshelf/config:/config
      - $DOCKERDIR/configdata/audiobookshelf/metadata:/metadata
    environment:
      - TZ=America/Toronto
    restart: unless-stopped
    networks:
      - caddy_proxy

  autoheal:
    image: willfarrell/autoheal:latest
    container_name: autoheal
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=30
      - AUTOHEAL_START_PERIOD=300

networks:
  caddy_proxy:
    external: true
