services:
  chat:
    image: m1k1o/chat:latest
    container_name: chat
    restart: unless-stopped
    ports:
      - 3002:80
    environment:
      CACHE_SIZE: 50 # optional: message count stored. Defaults to zero.
    networks:
      - traefik_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.chat-rtr.entrypoints=websecure"
      - "traefik.http.routers.chat-rtr.rule=Host(`chat.$DOMAINNAME_1`)"
      - "traefik.http.routers.chat-rtr.service=chat-svc"
      - "traefik.http.services.chat-svc.loadbalancer.server.port=80"
      - "traefik.http.routers.chat-rtr.middlewares=chain-no-auth@file"
