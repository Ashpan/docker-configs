name: discord
services:
  dcef:
    restart: always
    volumes:
      - $DOCKERDIR/appdata/discord/data:/dcef/exports
      - $DOCKERDIR/configdata/discord/cache:/dcef/cache
    container_name: discord
    ports:
      - 21011:21011
    stdin_open: true
    tty: true
    image: slada/dcef:main
    networks:
      - caddy_proxy
