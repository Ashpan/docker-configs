name: gpt
services:
  ollama:
    container_name: ollama
    image: ollama/ollama:latest
    restart: unless-stopped
    networks:
      - traefik_proxy
    volumes:
      - ollama:/root/.ollama
    tty: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: ${OLLAMA_GPU_DRIVER-nvidia}
              count: ${OLLAMA_GPU_COUNT-1}
              capabilities:
                - gpu

  open-webui:
    container_name: open-webui
    image: ghcr.io/open-webui/open-webui:main
    restart: always
    ports:
      - 9000:8080
    volumes:
      - open-webui:/app/backend/data
    depends_on:
      - ollama
    environment:
      - "OLLAMA_BASE_URL=http://ollama:11434"
      - "WEBUI_SECRET_KEY="
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      - traefik_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gpt-rtr.entrypoints=websecure"
      - "traefik.http.routers.gpt-rtr.rule=Host(`gpt.$DOMAINNAME_1`)"
      - "traefik.http.routers.gpt-rtr.service=gpt-svc"
      - "traefik.http.services.gpt-svc.loadbalancer.server.port=8080"
      - "traefik.http.routers.gpt-rtr.middlewares=chain-no-auth@file"

volumes:
  ollama: {}
  open-webui: {}
