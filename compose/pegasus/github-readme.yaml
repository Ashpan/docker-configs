services:
  gh-rdme-streak:
    container_name: github-readme-streak
    image: ashpan/gh-rdme-streak
    environment:
      - TOKEN=$GH_PAT
    ports:
      - 8002:8000
    restart: unless-stopped
    networks:
      - caddy_proxy

  gh-rdme-stats:
    container_name: github-readme-stats
    image: ashpan/gh-rdme-stats:latest
    environment:
      - PAT_1=$GH_PAT
    ports:
      - 9009:9000
    restart: unless-stopped
    networks:
      - caddy_proxy
