services:
  jellystat-db:
    container_name: jellystat-db
    image: postgres:15.2
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - /postgres-data:/var/lib/postgresql/data # Mounting the volume
    networks:
      - traefik_proxy

  jellystat:
    container_name: jellystat
    image: cyfershepard/jellystat:latest
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_IP: ${POSTGRES_IP}
      POSTGRES_PORT: ${POSTGRES_PORT}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "3000:3000" #Server Port
    volumes:
      - /backup-data:/app/backend/backup-data # Mounting the volume
    depends_on:
      - jellystat-db
    networks:
      - traefik_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jellystat-rtr.entrypoints=websecure"
      - "traefik.http.routers.jellystat-rtr.rule=Host(`jellystat.$DOMAINNAME_1`)"
      - "traefik.http.routers.jellystat-rtr.service=jellystat-svc"
      - "traefik.http.services.jellystat-svc.loadbalancer.server.port=3000"
      - "traefik.http.routers.jellystat-rtr.middlewares=chain-no-auth@file"
