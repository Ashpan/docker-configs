services:
  db:
    container_name: pastefy-db
    image: mariadb:10.11
    volumes:
      - dbvol:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    networks:
      - traefik_proxy

  pastefy:
    container_name: pastefy
    depends_on:
      - db
    image: interaapps/pastefy
    ports:
      # Host Post:Container Port. You only want to change the host port
      - "9999:80"
    networks:
      - traefik_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pastefy-rtr.entrypoints=websecure"
      - "traefik.http.routers.pastefy-rtr.rule=Host(`pastebin.$DOMAINNAME_1`)"
      - "traefik.http.routers.pastefy-rtr.service=pastefy-svc"
      - "traefik.http.services.pastefy-svc.loadbalancer.server.port=80"
      - "traefik.http.routers.pastefy-rtr.middlewares=chain-no-auth@file"

    environment:
      HTTP_SERVER_PORT: 80
      HTTP_SERVER_CORS: "*"
      DATABASE_DRIVER: mysql
      DATABASE_NAME: ${MYSQL_DATABASE}
      DATABASE_USER: ${MYSQL_USER}
      DATABASE_PASSWORD: ${MYSQL_PASSWORD}
      DATABASE_HOST: db
      DATABASE_PORT: ${MYSQL_PORT}
      # Set this to your domain
      SERVER_NAME: https://pastebin.$DOMAINNAME_1
      # There is INTERAAPPS, GOOGLE, GITHUB, DISCORD, TWITCH
      OAUTH2_INTERAAPPS_CLIENT_ID: ${OAUTH2_INTERAAPPS_CLIENT_ID}
      OAUTH2_INTERAAPPS_CLIENT_SECRET: ${OAUTH2_INTERAAPPS_CLIENT_SECRET}

volumes:
  dbvol:
