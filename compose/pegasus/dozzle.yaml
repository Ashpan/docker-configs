services:
  dozzle:
    container_name: dozzle
    image: amir20/dozzle:latest
    networks:
      - caddy_proxy
      - socket_proxy
    environment:
      DOCKER_HOST: tcp://socket-proxy:2375
      DOZZLE_AUTH_PROVIDER: forward-proxy
      DOZZLE_AUTH_HEADER_USER: X-Authentik-Username
      DOZZLE_AUTH_HEADER_EMAIL: X-Authentik-Email
      DOZZLE_AUTH_HEADER_NAME: X-Authentik-Name
      DOZZLE_AUTH_LOGOUT_URL: https://auth.ashpanraskar.com/application/o/dozzle/end-session/      
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - 8087:8080
    restart: unless-stopped
networks:
  caddy_proxy:
    external: true
