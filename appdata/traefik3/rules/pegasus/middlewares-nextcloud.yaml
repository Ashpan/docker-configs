http:
  middlewares:
    nextcloud-middlewares-secure-headers:
      headers:
        accessControlMaxAge: 100
        hostsProxyHeaders:
          - "X-Forwarded-Host"
        stsSeconds: 63072000
        stsIncludeSubdomains: true
        stsPreload: true
        # forceSTSHeader: true # This is a good thing but it can be tricky. Enable after everything works.
        customFrameOptionsValue: SAMEORIGIN # https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/X-Frame-Options
        contentTypeNosniff: true
        browserXssFilter: true
        referrerPolicy: "same-origin"
        permissionsPolicy: "camera=(), microphone=(), geolocation=(), payment=(), usb=(), vr=()"
        customResponseHeaders:
          X-Robots-Tag: "noindex,nofollow" # disable search engines from indexing home server
          server: "" # hide server info from visitors
    nextcloud-redirect:
      redirectRegex:
        permanent: true
        regex: "https://(.*)/.well-known/(card|cal)dav"
        replacement: "https://${1}/remote.php/dav/"
    nextcloud-limit:
      buffering:
        maxRequestBodyBytes: 5368709120   # 5GB max file size
        memRequestBodyBytes: 209715200    # Buffer only 200MB in memory
        maxResponseBodyBytes: 5368709120  # 5GB max response
        memResponseBodyBytes: 209715200   # Buffer only 200MB response in memory
        retryExpression: "IsNetworkError() && Attempts() <= 2"
