http:
  routers:
    klipper-bypass-rtr:
      entrypoints:
        - "websecure"
      middlewares:
        - chain-no-auth@file  # Use no-auth chain for these files
      rule: "Host(`klipper.{{env "DOMAINNAME_1"}}`) && (PathPrefix(`/manifest.webmanifest`) || PathPrefix(`/favicon.ico`) || PathPrefix(`/static/`) || PathPrefix(`/assets/`))"
      service: klipper-svc
      priority: 100  # Higher priority than the main rule
      tls:
        certResolver: dns-cloudflare
        options: tls-opts@file

    klipper-rtr:
      entrypoints:
        - "websecure"
      middlewares:
        - chain-authelia@file
      rule: "Host(`klipper.{{env "DOMAINNAME_1"}}`)"
      service: klipper-svc
      tls:
        certResolver: dns-cloudflare
        options: tls-opts@file

  services:
    klipper-svc:
      loadBalancer:
        passHostHeader: true
        responseForwarding:
          flushInterval: 100ms
        servers:
          - url: "http://192.168.68.248" # Use the host's IP address if Traefik runs outside the host network

